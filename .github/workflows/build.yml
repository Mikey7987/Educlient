          cat > src/main/java/com/example/educlient/module/combat/ShieldBreaker.java <<'JAVA'
          package com.example.educlient.module.combat;

          import com.example.educlient.module.Category;
          import com.example.educlient.module.Module;
          import com.example.educlient.setting.SliderSetting;
          import com.example.educlient.setting.ToggleSetting;
          import com.example.educlient.util.TimerUtil;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.AxeItem;
          import net.minecraft.item.ItemStack;
          import net.minecraft.util.Hand;

          import java.util.Random;

          public class ShieldBreaker extends Module {
              public final SliderSetting triggerChance = add(new SliderSetting("Trigger Chance (%)", 75.0, 1.0, 100.0, 1.0));
              public final SliderSetting reactionDelay = add(new SliderSetting("Reaction Delay (ms)", 50.0, 0.0, 200.0, 1.0));
              public final SliderSetting swapToHitDelay = add(new SliderSetting("Swap-to-Hit Delay (ms)", 40.0, 0.0, 150.0, 1.0));
              public final SliderSetting swapBackDelay = add(new SliderSetting("Swap Back Delay (ms)", 80.0, 0.0, 200.0, 1.0));
              public final ToggleSetting swapBack = add(new ToggleSetting("Swap Back", true));

              private final Random random = new Random();
              private final TimerUtil timer = new TimerUtil();
              private State state = State.IDLE;
              private int originalSlot = -1;
              private int axeSlot = -1;
              private LivingEntity target;

              public ShieldBreaker() { super("ShieldBreaker", Category.COMBAT); }

              @Override public void onDisable() { state = State.IDLE; originalSlot = -1; axeSlot = -1; target = null; }

              @Override
              public void onTick() {
                  if (mc.player == null || mc.world == null) return;
                  switch (state) {
                      case IDLE: tryStart(); break;
                      case WAITING_REACTION: if (timer.hasElapsed((long) reactionDelay.getValue())) swapToAxe(); break;
                      case WAITING_SWAP: if (timer.hasElapsed((long) swapToHitDelay.getValue())) performHit(); break;
                      case WAITING_SWAP_BACK: if (timer.hasElapsed((long) swapBackDelay.getValue())) swapBackAndReset(); break;
                  }
              }

              private void tryStart() {
                  if (!(mc.crosshairTarget instanceof net.minecraft.util.hit.EntityHitResult ehr)) return;
                  if (!(ehr.getEntity() instanceof PlayerEntity p)) return;
                  if (!p.isBlocking() || p.isDead() || mc.player.distanceTo(p) > 4.0) return;
                  if (random.nextFloat() * 100f > triggerChance.getValue()) return;
                  int found = -1;
                  for (int i = 0; i < 9; i++) {
                      ItemStack st = mc.player.getInventory().getStack(i);
                      if (st.getItem() instanceof AxeItem) { found = i; break; }
                  }
                  if (found == -1) return;
                  target = p;
                  originalSlot = mc.player.getInventory().selectedSlot;
                  axeSlot = found;
                  state = State.WAITING_REACTION;
                  timer.reset();
              }

              private void swapToAxe() {
                  if (axeSlot >= 0 && axeSlot < 9) mc.player.getInventory().selectedSlot = axeSlot;
                  state = State.WAITING_SWAP;
                  timer.reset();
              }

              private void performHit() {
                  if (target == null || !target.isAlive() || !(target instanceof PlayerEntity p) || !p.isBlocking()) { reset(); return; }
                  mc.interactionManager.attackEntity(mc.player, target);
                  mc.player.swingHand(Hand.MAIN_HAND);
                  if (swapBack.getValue()) { state = State.WAITING_SWAP_BACK; timer.reset(); } else reset();
              }

              private void swapBackAndReset() {
                  if (originalSlot >= 0 && originalSlot < 9) mc.player.getInventory().selectedSlot = originalSlot;
                  reset();
              }

              private void reset() { state = State.IDLE; originalSlot = -1; axeSlot = -1; target = null; }

              private enum State { IDLE, WAITING_REACTION, WAITING_SWAP, WAITING_SWAP_BACK }
          }
