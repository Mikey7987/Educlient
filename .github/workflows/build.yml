          package com.example.educlient.gui;

          import net.minecraft.client.gui.DrawContext;

          public final class GuiHelper {
              private GuiHelper() {}
              public static void fillRoundedRect(DrawContext c, int x, int y, int w, int h, int r, int col) {
                  c.fill(x + r, y, x + w - r, y + h, col);
                  c.fill(x, y + r, x + r, y + h - r, col);
                  c.fill(x + w - r, y + r, x + w, y + h - r, col);
                  c.fill(x + r, y, x + w - r, y + r, col);
                  c.fill(x + r, y + h - r, x + w - r, y + h, col);
              }
              public static boolean isHovered(double mx, double my, int x, int y, int w, int h) {
                  return mx >= x && mx <= x + w && my >= y && my <= y + h;
              }
          }
