          cat > src/main/java/com/example/educlient/setting/ModeSetting.java <<'JAVA'
          package com.example.educlient.setting;

          import java.util.List;

          public class ModeSetting extends Setting<String> {
              private final List<String> modes;
              public ModeSetting(String name, String d, List<String> modes) { super(name, d); this.modes = modes; }
              public List<String> getModes() { return modes; }
              public void cycle() { int i = modes.indexOf(value); value = modes.get((i + 1) % modes.size()); }
              public void cycleReverse() { int i = modes.indexOf(value); value = modes.get((i - 1 + modes.size()) % modes.size()); }
          }
