name: Build EduClient

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Scaffold project
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/com/example/educlient/client
          mkdir -p src/main/java/com/example/educlient/module/combat
          mkdir -p src/main/java/com/example/educlient/module/render
          mkdir -p src/main/java/com/example/educlient/module/player
          mkdir -p src/main/java/com/example/educlient/module/movement
          mkdir -p src/main/java/com/example/educlient/setting
          mkdir -p src/main/java/com/example/educlient/gui
          mkdir -p src/main/java/com/example/educlient/util
          mkdir -p src/main/java/com/example/educlient/mixin
          mkdir -p src/main/resources

          cat > gradle.properties <<'GRADLEPROPS'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.1
          loader_version=0.18.2
          fabric_version=0.141.3+1.21.11
          loom_version=1.13.3
          GRADLEPROPS

          cat > settings.gradle <<'SETTINGSGRADLE'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
              }
          }
          SETTINGSGRADLE

          cat > build.gradle <<'BUILDGRADLE'
          plugins {
              id 'fabric-loom' version "${loom_version}"
          }
          version = '1.0.0'
          group = 'com.example.educlient'
          base { archivesName = 'educational-client' }
          repositories {
              maven { url = 'https://maven.fabricmc.net/' }
              mavenCentral()
          }
          dependencies {
              minecraft "com.mojang:minecraft:${minecraft_version}"
              mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
          BUILDGRADLE

          cat > src/main/resources/fabric.mod.json <<'FABRICMOD'
          {
            "schemaVersion": 1,
            "id": "educlient",
            "version": "${version}",
            "name": "Educational Client",
            "description": "Modular client.",
            "authors": ["Example"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.example.educlient.EduClient"]
            },
            "mixins": ["educlient.mixins.json"],
            "depends": {
              "fabricloader": ">=0.17.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          FABRICMOD

          cat > src/main/resources/educlient.mixins.json <<'MIXINSJSON'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.educlient.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["KeyboardMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          MIXINSJSON

          cat > src/main/java/com/example/educlient/EduClient.java <<'JAVA'
          package com.example.educlient;

          import com.example.educlient.client.ModuleManager;
          import net.fabricmc.api.ClientModInitializer;

          public class EduClient implements ClientModInitializer {
              public static final String MOD_ID = "educlient";
              public static ModuleManager MODULE_MANAGER;

              @Override
              public void onInitializeClient() {
                  MODULE_MANAGER = new ModuleManager();
                  MODULE_MANAGER.init();
              }
          }
          JAVA

          cat > src/main/java/com/example/educlient/client/ModuleManager.java <<'JAVA'
          package com.example.educlient.client;

          import com.example.educlient.module.Module;
          import com.example.educlient.module.combat.*;
          import com.example.educlient.module.movement.PlaceholderMovementModule;
          import com.example.educlient.module.player.PlaceholderPlayerModule;
          import com.example.educlient.module.render.PlaceholderRenderModule;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayList;
          import java.util.List;

          public class ModuleManager {
              public final List<Module> modules = new ArrayList<>();
              public KeyBinding clickGuiKey;

              public void init() {
                  modules.add(new AimAssist());
                  modules.add(new TriggerBot());
                  modules.add(new Hitbox());
                  modules.add(new ShieldBreaker());
                  modules.add(new PlaceholderRenderModule());
                  modules.add(new PlaceholderPlayerModule());
                  modules.add(new PlaceholderMovementModule());

                  clickGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.educlient.clickgui",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT,
                          "category.educlient"
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (clickGuiKey.wasPressed()) {
                          client.setScreen(new com.example.educlient.gui.ClickGuiScreen());
                      }
                      for (Module module : modules) {
                          if (module.isEnabled()) module.onTick();
                      }
                  });
              }

              public <T extends Module> T getModule(Class<T> clazz) {
                  for (Module module : modules) {
                      if (clazz.isInstance(module)) return clazz.cast(module);
                  }
                  return null;
              }
          }
          JAVA

          cat > src/main/java/com/example/educlient/module/Module.java <<'JAVA'
          package com.example.educlient.module;

          import com.example.educlient.setting.Setting;
          import net.minecraft.client.MinecraftClient;

          import java.util.ArrayList;
          import java.util.List;

          public abstract class Module {
              protected static final MinecraftClient mc = MinecraftClient.getInstance();
              private final String name;
              private final Category category;
              private boolean enabled;
              private int key = -1;
              public final List<Setting<?>> settings = new ArrayList<>();

              public Module(String name, Category category) {
                  this.name = name;
                  this.category = category;
              }

              public String getName() { return name; }
              public Category getCategory() { return category; }
              public boolean isEnabled() { return enabled; }
              public void setEnabled(boolean enabled) {
                  this.enabled = enabled;
                  if (enabled) onEnable(); else onDisable();
              }
              public void toggle() { setEnabled(!enabled); }
              public int getKey() { return key; }
              public void setKey(int key) { this.key = key; }
              public void onEnable() {}
              public void onDisable() {}
              public void onTick() {}

              protected <T extends Setting<?>> T add(T setting) {
                  settings.add(setting);
                  return setting;
              }
          }
          JAVA

