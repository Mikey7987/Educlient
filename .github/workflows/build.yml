          package com.example.educlient.module.combat;

          import com.example.educlient.module.Category;
          import com.example.educlient.module.Module;
          import com.example.educlient.setting.SliderSetting;
          import com.example.educlient.setting.ToggleSetting;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.AxeItem;
          import net.minecraft.item.SwordItem;
          import net.minecraft.util.math.Box;

          public class Hitbox extends Module {
              public final SliderSetting expandWidth = add(new SliderSetting("Expand Width", 0.10, 0.00, 0.50, 0.01));
              public final ToggleSetting playersOnly = add(new ToggleSetting("Players Only", true));
              public final ToggleSetting weaponOnly = add(new ToggleSetting("Weapon Only", false));

              public Hitbox() { super("Hitbox", Category.COMBAT); }

              public Box getExpandedBox(Entity e) {
                  Box b = e.getBoundingBox();
                  double w = expandWidth.getValue();
                  if (w <= 0) return b;
                  return b.expand(w, 0, w);
              }

              public boolean shouldExpand(Entity e) {
                  if (!(e instanceof LivingEntity l)) return false;
                  if (playersOnly.getValue() && !(l instanceof PlayerEntity)) return false;
                  if (weaponOnly.getValue()) {
                      var s = mc.player.getMainHandStack();
                      return s.getItem() instanceof SwordItem || s.getItem() instanceof AxeItem;
                  }
                  return true;
              }
          }
