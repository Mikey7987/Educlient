          cat > src/main/java/com/example/educlient/module/combat/AimAssist.java <<'JAVA'
          package com.example.educlient.module.combat;

          import com.example.educlient.module.Category;
          import com.example.educlient.module.Module;
          import com.example.educlient.setting.ModeSetting;
          import com.example.educlient.setting.SliderSetting;
          import com.example.educlient.setting.ToggleSetting;
          import com.example.educlient.util.MathUtil;
          import com.example.educlient.util.RotationUtil;
          import com.example.educlient.util.TargetUtil;
          import com.example.educlient.util.TimerUtil;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.util.math.Vec3d;

          import java.util.List;

          public class AimAssist extends Module {
              public final SliderSetting smoothness = add(new SliderSetting("Smoothness", 30.0, 1.0, 100.0, 0.5));
              public final SliderSetting speed1 = add(new SliderSetting("Speed 1 (Horizontal)", 1.0, 0.0, 2.0, 0.05));
              public final SliderSetting speed2 = add(new SliderSetting("Speed 2 (Vertical)", 1.0, 0.0, 2.0, 0.05));
              public final SliderSetting reactionTime = add(new SliderSetting("Reaction Time", 50.0, 0.0, 300.0, 1.0));
              public final SliderSetting overshoot = add(new SliderSetting("Overshoot", 0.0, 0.0, 30.0, 0.5));
              public final SliderSetting fov = add(new SliderSetting("FOV", 90.0, 10.0, 180.0, 1.0));
              public final SliderSetting range = add(new SliderSetting("Range", 4.5, 2.5, 6.0, 0.1));
              public final ModeSetting aimMode = add(new ModeSetting("Aim Mode", "Smooth", List.of("Linear", "Smooth", "Balanced")));
              public final ModeSetting priority = add(new ModeSetting("Priority", "Distance", List.of("Distance", "Health", "Last Hit")));
              public final ToggleSetting weaponOnly = add(new ToggleSetting("Weapon Only", true));
              public final ToggleSetting playersOnly = add(new ToggleSetting("Players Only", true));
              public final ToggleSetting requireClick = add(new ToggleSetting("Require Click", false));

              private LivingEntity target;
              private final TimerUtil reactionTimer = new TimerUtil();
              private float overshootYaw, overshootPitch;
              private boolean overshooting;

              public AimAssist() { super("AimAssist", Category.COMBAT); }

              @Override public void onEnable() { resetState(); }
              @Override public void onDisable() { resetState(); }

              private void resetState() {
                  target = null; overshooting = false;
                  reactionTimer.reset(); overshootYaw = 0; overshootPitch = 0;
              }

              @Override
              public void onTick() {
                  if (mc.player == null || mc.world == null) return;
                  if (requireClick.getValue() && !mc.options.useKey.isPressed()) { target = null; return; }
                  if (weaponOnly.getValue() && !TargetUtil.isHoldingWeapon(mc.player)) { target = null; return; }

                  LivingEntity newTarget = TargetUtil.findBestTarget(mc.player, range.getValue(), fov.getValue(), priority.getValue(), playersOnly.getValue());
                  if (newTarget != target) { target = newTarget; overshooting = false; reactionTimer.reset(); }
                  if (target == null || target.isDead()) return;
                  if (!reactionTimer.hasElapsed((long) reactionTime.getValue())) return;
                  performRotation(target);
              }

              private void performRotation(LivingEntity target) {
                  Vec3d eyePos = mc.player.getEyePos();
                  Vec3d targetPos = TargetUtil.getAimPoint(target);
                  float[] desired = RotationUtil.calculateAngles(eyePos, targetPos);
                  float currentYaw = mc.player.getYaw();
                  float currentPitch = mc.player.getPitch();
                  float deltaYaw = MathUtil.wrapDegrees(desired[0] - currentYaw);
                  float deltaPitch = desired[1] - currentPitch;

                  deltaYaw *= speed1.getValue();
                  deltaPitch *= speed2.getValue();

                  float distance = (float) Math.sqrt(deltaYaw * deltaYaw + deltaPitch * deltaPitch);
                  if (distance < 0.05f) { overshooting = false; return; }

                  if (overshoot.getValue() > 0 && !overshooting && distance > 5f) {
                      float f = (float) (overshoot.getValue() / 100.0);
                      overshootYaw = deltaYaw * f; overshootPitch = deltaPitch * f; overshooting = true;
                  }
                  float tY = overshooting ? deltaYaw + overshootYaw : deltaYaw;
                  float tP = overshooting ? deltaPitch + overshootPitch : deltaPitch;
                  if (overshooting && Math.abs(deltaYaw) < 2f && Math.abs(deltaPitch) < 2f) { overshooting = false; tY = deltaYaw; tP = deltaPitch; }

                  float speed = computeSpeed(distance);
                  float newYaw = currentYaw + clamp(tY, speed);
                  float newPitch = currentPitch + clamp(tP, speed);
                  newPitch = MathUtil.clamp(newPitch, -90f, 90f);
                  mc.player.setYaw(newYaw);
                  mc.player.setPitch(newPitch);
              }

              private float clamp(float d, float m) { return Math.max(-m, Math.min(m, d)); }

              private float computeSpeed(float distance) {
                  double sf = smoothness.getValue();
                  double base = 1.0 / (1.0 + sf * 0.1);
                  switch (aimMode.getValue()) {
                      case "Linear": return (float) (base * 8.0);
                      case "Smooth": return (float) (base * (2.0 + distance * 0.8));
                      default:
                          float n = Math.min(1f, distance / 45f);
                          float s = (float) (1.0 - Math.pow(1.0 - n, 3));
                          return (float) (base * (2.5 + s * 6.0));
                  }
              }
          }
          JAVA

          cat > src/main/java/com/example/educlient/module/combat/TriggerBot.java <<'JAVA'
          package com.example.educlient.module.combat;

          import com.example.educlient.module.Category;
          import com.example.educlient.module.Module;
          import com.example.educlient.setting.SliderSetting;
          import com.example.educlient.setting.ToggleSetting;
          import com.example.educlient.util.TargetUtil;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.AxeItem;
          import net.minecraft.item.MaceItem;
          import net.minecraft.item.SwordItem;
          import net.minecraft.util.hit.EntityHitResult;

          import java.util.Random;

          public class TriggerBot extends Module {
              public final SliderSetting cooldownThreshold = add(new SliderSetting("Cooldown Threshold", 0.92, 0.85, 1.00, 0.01));
              public final SliderSetting hoverDelay = add(new SliderSetting("Hover Delay (ms)", 25.0, 0.0, 150.0, 1.0));
              public final SliderSetting postCooldownExtra = add(new SliderSetting("Post-Cooldown Extra (ms)", 10.0, 0.0, 100.0, 1.0));
              public final ToggleSetting smartAirCrits = add(new ToggleSetting("Smart Air Crits", true));
              public final ToggleSetting shieldCheck = add(new ToggleSetting("Shield Check", true));
              public final ToggleSetting weaponOnly = add(new ToggleSetting("Weapon Only", true));

              private final Random random = new Random();
              private long hoverStart = -1;
              private long lastCooldownComplete = -1;

              public TriggerBot() { super("TriggerBot", Category.COMBAT); }

              @Override public void onDisable() { hoverStart = -1; lastCooldownComplete = -1; }

              @Override
              public void onTick() {
                  if (mc.player == null || mc.world == null) return;
                  if (weaponOnly.getValue() && !isValidWeapon()) return;

                  Entity crosshair = null;
                  if (mc.crosshairTarget instanceof EntityHitResult ehr) crosshair = ehr.getEntity();

                  if (!(crosshair instanceof LivingEntity living) || !living.isAlive()) { hoverStart = -1; return; }
                  if (!TargetUtil.isValidTarget(living, true)) { hoverStart = -1; return; }

                  if (shieldCheck.getValue() && living instanceof PlayerEntity p && p.isBlocking()) {
                      ShieldBreaker breaker = com.example.educlient.EduClient.MODULE_MANAGER.getModule(ShieldBreaker.class);
                      if (breaker == null || !breaker.isEnabled()) return;
                  }

                  if (hoverStart == -1) hoverStart = System.currentTimeMillis();
                  long hoverElapsed = System.currentTimeMillis() - hoverStart;
                  double hoverReq = hoverDelay.getValue() + random.nextGaussian() * 10.0;
                  if (hoverElapsed < Math.max(0, hoverReq)) return;

                  float cd = mc.player.getAttackCooldownProgress(0.5f);
                  if (cd < cooldownThreshold.getValue()) { lastCooldownComplete = -1; return; }

                  if (lastCooldownComplete == -1) lastCooldownComplete = System.currentTimeMillis();
                  if (System.currentTimeMillis() - lastCooldownComplete < postCooldownExtra.getValue()) return;

                  if (smartAirCrits.getValue() && !mc.player.isOnGround()) {
                      if (mc.player.getVelocity().y >= 0) return;
                  }

                  mc.interactionManager.attackEntity(mc.player, living);
                  mc.player.swingHand(net.minecraft.util.Hand.MAIN_HAND);
                  hoverStart = -1; lastCooldownComplete = -1;
              }

              private boolean isValidWeapon() {
                  var s = mc.player.getMainHandStack();
                  return s.getItem() instanceof SwordItem || s.getItem() instanceof AxeItem || s.getItem() instanceof MaceItem;
              }
          }
