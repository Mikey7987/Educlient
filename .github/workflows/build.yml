          cat > src/main/java/com/example/educlient/setting/Setting.java <<'JAVA'
          package com.example.educlient.setting;

          public abstract class Setting<T> {
              private final String name;
              protected T value;
              public Setting(String name, T defaultValue) { this.name = name; this.value = defaultValue; }
              public String getName() { return name; }
              public T getValue() { return value; }
              public void setValue(T value) { this.value = value; }
          }
          JAVA

          cat > src/main/java/com/example/educlient/setting/SliderSetting.java <<'JAVA'
          package com.example.educlient.setting;

          public class SliderSetting extends Setting<Double> {
              public final double min, max, step;
              private final double defaultValue;
              public SliderSetting(String name, double d, double min, double max, double step) {
                  super(name, d); this.defaultValue = d; this.min = min; this.max = max; this.step = step;
              }
              public void setValueSnapped(double raw) {
                  double s = Math.round(raw / step) * step;
                  this.value = Math.max(min, Math.min(max, s));
              }
              public void reset() { this.value = defaultValue; }
              public float getPercentage() { return (float) ((value - min) / (max - min)); }
          }
          JAVA

