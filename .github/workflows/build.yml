          cat > src/main/java/com/example/educlient/util/MathUtil.java <<'JAVA'
          package com.example.educlient.util;

          public final class MathUtil {
              private MathUtil() {}
              public static float wrapDegrees(float d) {
                  float x = d % 360f;
                  if (x >= 180f) x -= 360f;
                  if (x < -180f) x += 360f;
                  return x;
              }
              public static float clamp(float v, float min, float max) { return Math.max(min, Math.min(max, v)); }
              public static double clamp(double v, double min, double max) { return Math.max(min, Math.min(max, v)); }
          }
          JAVA

          cat > src/main/java/com/example/educlient/util/RotationUtil.java <<'JAVA'
          package com.example.educlient.util;

          import net.minecraft.util.math.Vec3d;

          public final class RotationUtil {
              private RotationUtil() {}
              public static float[] calculateAngles(Vec3d from, Vec3d to) {
                  double dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
                  double dist = Math.sqrt(dx * dx + dz * dz);
                  float yaw = (float) (Math.toDegrees(Math.atan2(dz, dx)) - 90.0);
                  float pitch = (float) -Math.toDegrees(Math.atan2(dy, dist));
                  return new float[]{yaw, pitch};
              }
          }
          JAVA

          cat > src/main/java/com/example/educlient/util/TimerUtil.java <<'JAVA'
          package com.example.educlient.util;

          public class TimerUtil {
              private long lastReset = System.currentTimeMillis();
              public void reset() { lastReset = System.currentTimeMillis(); }
              public boolean hasElapsed(long ms) { return System.currentTimeMillis() - lastReset >= ms; }
              public long getElapsed() { return System.currentTimeMillis() - lastReset; }
          }
          JAVA

          cat > src/main/java/com/example/educlient/util/TargetUtil.java <<'JAVA'
          package com.example.educlient.util;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.AxeItem;
          import net.minecraft.item.SwordItem;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.Vec3d;

          import java.util.Comparator;
          import java.util.List;
          import java.util.stream.Collectors;

          public final class TargetUtil {
              private TargetUtil() {}
              public static LivingEntity findBestTarget(PlayerEntity player, double range, double fov, String priority, boolean playersOnly) {
                  List<LivingEntity> cands = player.getWorld().getEntitiesByClass(
                          LivingEntity.class,
                          new Box(player.getBlockPos()).expand(range),
                          e -> isValidTarget(e, playersOnly)
                  );
                  if (cands.isEmpty()) return null;
                  Vec3d eye = player.getEyePos();
                  float py = player.getYaw(), pp = player.getPitch();
                  cands = cands.stream().filter(e -> {
                      float[] a = RotationUtil.calculateAngles(eye, getAimPoint(e));
                      float dy = Math.abs(MathUtil.wrapDegrees(a[0] - py));
                      float dp = Math.abs(a[1] - pp);
                      return Math.sqrt(dy * dy + dp * dp) <= fov / 2.0;
                  }).collect(Collectors.toList());
                  if (cands.isEmpty()) return null;
                  Comparator<LivingEntity> cmp = Comparator.comparingDouble(e -> e.squaredDistanceTo(player));
                  if ("Health".equals(priority)) cmp = Comparator.comparingDouble(LivingEntity::getHealth);
                  return cands.stream().min(cmp).orElse(null);
              }

              public static boolean isValidTarget(LivingEntity e, boolean playersOnly) {
                  if (e == null || !e.isAlive()) return false;
                  if (e == MinecraftClient.getInstance().player) return false;
                  if (playersOnly && !(e instanceof PlayerEntity)) return false;
                  return true;
              }

              public static Vec3d getAimPoint(LivingEntity t) {
                  Box b = t.getBoundingBox();
                  return new Vec3d((b.minX + b.maxX) / 2.0, b.minY + (b.maxY - b.minY) * 0.6, (b.minZ + b.maxZ) / 2.0);
              }

              public static boolean isHoldingWeapon(PlayerEntity p) {
                  var s = p.getMainHandStack();
                  return s.getItem() instanceof SwordItem || s.getItem() instanceof AxeItem;
              }
          }
          JAVA

          cat > src/main/java/com/example/educlient/mixin/KeyboardMixin.java <<'JAVA'
          package com.example.educlient.mixin;

          import com.example.educlient.EduClient;
          import com.example.educlient.gui.ClickGuiScreen;
          import com.example.educlient.module.Module;
          import net.minecraft.client.Keyboard;
          import net.minecraft.client.MinecraftClient;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(Keyboard.class)
          public class KeyboardMixin {
              @Inject(method = "onKey", at = @At("HEAD"))
              private void educlient$onKey(long window, int key, int scancode, int action, int modifiers, CallbackInfo ci) {
                  if (action != 1) return;
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client.currentScreen instanceof ClickGuiScreen) return;
                  if (EduClient.MODULE_MANAGER == null) return;
                  for (Module m : EduClient.MODULE_MANAGER.modules) if (m.getKey() == key) m.toggle();
              }
          }
